name: Tests

on:
  push:
  pull_request:
  # A dormant package still needs to hear about a new PHP release. Note that
  # GitHub disables scheduled workflows after 60 days without repository
  # activity, and emails before it does.
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} ${{ matrix.deps }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      # The corners of the supported range, not the whole matrix: the floor with the
      # oldest dependencies it claims, the floor with current ones, and the ceiling.
      # Everything between fails only when a corner does.
      matrix:
        include:
          - { php: '8.3', deps: '--prefer-lowest' }
          - { php: '8.3', deps: '' }
          - { php: '8.5', deps: '' }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer update --prefer-dist --no-progress ${{ matrix.deps }}

      - run: vendor/bin/phpunit

      # Also here, not only in a job of its own: phpstan.neon covers the whole 8.3 - 8.5
      # PHP range in one pass wherever it runs, but its result still depends on the
      # dependency tree it resolved against - including phpstan's own version, which is
      # what the --prefer-lowest corner is for.
      - run: vendor/bin/phpstan analyse --no-progress

  dependencies:
    name: Declared dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          # Both are dev dependencies the --no-dev install below deletes, so both have to
          # come from outside the package. Taking them from setup-php rather than installing
          # them into a scratch directory is not only shorter: it puts the binaries outside
          # every vendor tree, and for PHPStan that is load-bearing. Run through a Composer
          # proxy - anyone's, including a scratch install's own - PHPStan picks up the
          # autoloader beside it, and every package THAT tree has installed then resolves in
          # the code being analysed. The check passes on exactly the class it exists to catch
          # and prints "[OK] No errors" doing it.
          tools: phpstan, composer-require-checker

      # Two checks here and they catch different things, so the order is chosen to let one
      # install serve both.
      #
      # composer-require-checker first, against the full tree. It maps every symbol src/ uses
      # back to the package that provides it, and it is the only half that sees a TRANSITIVE
      # dependency - one arriving through something we did declare, which survives --no-dev
      # and so reports clean below - and the only half that sees a missing ext-*, which is
      # invisible to static analysis because a function from an absent extension looks exactly
      # like one from core. ext-ctype and ext-json are declared for precisely that reason, and
      # nothing but this job would notice if one went missing.
      #
      # What is installed does not change its answer - it builds its known-symbol set from
      # what "require" NAMES, not from what is on disk - so this could equally run against the
      # stripped tree. It runs here because the install is needed anyway.
      - run: composer install --prefer-dist --no-progress

      - run: composer-require-checker check composer.json

      # Now take the dev dependencies away and analyse src/ against what a consumer actually
      # gets, so anything it calls that is not in "require" comes back as not-found. A normal
      # PHPStan run has Guzzle and PHPUnit installed and sees nothing wrong; the package would
      # fatal for the consumer instead. It matters here more than most, the whole point of
      # this package being that it needs four PSR interfaces and nothing else.
      #
      # This half is meaningful only because src/ is classes. PHPStan skips the body of a
      # trait no analysed class uses, so on a package whose src/ is traits this step would
      # report success over code it never read.
      - run: composer install --no-dev --prefer-dist --no-progress

      # -c is not optional. Without it PHPStan discovers the package's own phpstan.neon.dist,
      # which points at tests/ and can no longer resolve PHPUnit - turning the run into a
      # configuration error while you are trying to read it as a dependency result.
      - run: >
          phpstan analyse -c .github/phpstan-nodev.neon
          --autoload-file=vendor/autoload.php --no-progress

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer validate --strict

      - run: composer install --prefer-dist --no-progress

      - run: vendor/bin/pint --test
